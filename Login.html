<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova School - Login</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/estilos.css">
</head>
<body>
    <div class="card card-login bg-white p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3" estilos="width: 60px; heigth: 60px;">
                <i class="bi bi-shield-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Innova Schools</h3>
            <p class="text-muted small">Gestion de Reservas de Laboratorio</p>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Correo Institucional</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="correo" class="form-control" placeholder="usuario@innovaschools.edu.pe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-ligth"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="........" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Perfil / Rol de Acceso</label>
                <select  id="rol" class="form-select">
                    <option value="Docente/Estudiante">Docente / Estudiante</option>
                    <option value="Coordinador">Coordinador de Laboratorio</option>
                    <option value="Tecnico">Tecnico de Soporte</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-rigth me-1"></i>Ingresar al Sistema
            </button>
        </form>
    </div>
    
    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e){
            e.preventDefault();
            const correo =document.getElementById('correo').value;
            const rol= document.getElementById('rol').value;
            localStorage.setItem('usuarioActivo', correo);
            localStorage.setItem('rolActivo', rol);

            window.location.href = 'boostrap.html';
        });
    </script>
</body>
</html>
