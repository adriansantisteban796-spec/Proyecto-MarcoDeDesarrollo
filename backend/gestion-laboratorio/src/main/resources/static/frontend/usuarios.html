<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova School - Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/estilos.css">
    <script src="Js/app.js"></script>
    <script>
        // Solo el Coordinador administra usuarios
        if (!Sesion.esCoordinador()) {
            window.location.href = 'boostrap.html';
        }
    </script>
</head>
<body class="bg-light">

  <div class="container my-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h2 class="fw-bold text-dark mb-1">Usuarios del Sistema</h2>
        <p class="text-muted mb-0">Registro de docentes, estudiantes y técnicos con correo institucional.</p>
      </div>
      <div class="mt-3 mt-md-0">
        <button class="btn btn-primary shadow-sm" id="btnNuevoUsuario">
          <i class="bi bi-person-plus me-1"></i> Registrar Usuario
        </button>
      </div>
    </div>

    <div id="aviso" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="ps-3">Nombre</th>
                <th scope="col">Correo</th>
                <th scope="col">Rol</th>
                <th scope="col" class="text-end pe-3">Acción</th>
              </tr>
            </thead>
            <tbody id="tablaUsuarios">
              <tr><td colspan="4" class="text-center text-muted py-4">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Registrar / editar usuario -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold" id="tituloUsuario"><i class="bi bi-person-plus me-2"></i>Registrar Usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formUsuario">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Nombre</label>
                <input type="text" id="usNombre" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Apellido</label>
                <input type="text" id="usApellido" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Correo institucional</label>
              <input type="email" id="usCorreo" class="form-control" placeholder="usuario@innovaschools.edu.pe" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Rol</label>
                <select id="usRol" class="form-select" required>
                  <option value="Docente">Docente</option>
                  <option value="Estudiante">Estudiante</option>
                  <option value="Tecnico">Técnico</option>
                  <option value="Coordinador">Coordinador</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="usPassword" class="form-control" autocomplete="new-password">
                <div class="form-text" id="ayudaPassword"></div>
              </div>
            </div>
            <div id="errorUsuario" class="alert alert-danger py-2 small d-none mb-0"></div>
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary px-4" id="btnGuardarUsuario">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    montarLayout('usuarios', 'Administración de Usuarios');

    const modal = id => bootstrap.Modal.getOrCreateInstance(document.getElementById(id));
    let usuarios = [];
    let usuarioEnEdicion = null;

    async function recargar() {
        const r = await api('/api/usuarios');
        const tbody = document.getElementById('tablaUsuarios');

        if (!r.ok) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">No se pudieron cargar los usuarios.</td></tr>';
            return;
        }

        usuarios = r.datos;

        tbody.innerHTML = usuarios.map((u, i) => {
            const esYo = u.correo === Sesion.correo();
            return `
              <tr>
                <td class="ps-3 fw-semibold">${escapar(u.nombre)} ${escapar(u.apellido)}</td>
                <td>${escapar(u.correo)}</td>
                <td><span class="badge bg-light text-dark border">${escapar(u.rol)}</span></td>
                <td class="text-end pe-3 text-nowrap">
                  <button class="btn btn-sm btn-outline-secondary me-1" data-accion="editar" data-i="${i}" title="Editar"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-outline-danger" data-accion="eliminar" data-i="${i}" title="${esYo ? 'No puedes eliminar tu propio usuario' : 'Eliminar'}" ${esYo ? 'disabled' : ''}><i class="bi bi-trash"></i></button>
                </td>
              </tr>`;
        }).join('') || '<tr><td colspan="4" class="text-center text-muted py-4">No hay usuarios.</td></tr>';
    }

    function abrirForm(u) {
        usuarioEnEdicion = u;
        document.getElementById('formUsuario').reset();
        document.getElementById('errorUsuario').classList.add('d-none');
        document.getElementById('tituloUsuario').innerHTML =
            '<i class="bi bi-person-plus me-2"></i>' + (u ? 'Editar Usuario' : 'Registrar Usuario');

        const correo = document.getElementById('usCorreo');
        const password = document.getElementById('usPassword');

        correo.readOnly = !!u;
        password.required = !u;
        document.getElementById('ayudaPassword').textContent =
            u ? 'Déjala vacía para conservar la actual.' : 'Se guarda cifrada.';

        if (u) {
            document.getElementById('usNombre').value = u.nombre || '';
            document.getElementById('usApellido').value = u.apellido || '';
            correo.value = u.correo;
            document.getElementById('usRol').value = u.rol;
        }

        modal('modalUsuario').show();
    }

    document.getElementById('btnNuevoUsuario').addEventListener('click', () => abrirForm(null));

    document.getElementById('btnGuardarUsuario').addEventListener('click', async () => {
        const form = document.getElementById('formUsuario');
        const error = document.getElementById('errorUsuario');
        error.classList.add('d-none');

        if (!form.reportValidity()) return;

        const cuerpo = {
            nombre: document.getElementById('usNombre').value.trim(),
            apellido: document.getElementById('usApellido').value.trim(),
            correo: document.getElementById('usCorreo').value.trim(),
            rol: document.getElementById('usRol').value
        };

        const password = document.getElementById('usPassword').value;
        if (password) cuerpo.password = password;

        const r = usuarioEnEdicion
            ? await api('/api/usuarios/' + encodeURIComponent(usuarioEnEdicion.correo), { method: 'PUT', body: cuerpo })
            : await api('/api/usuarios', { method: 'POST', body: cuerpo });

        if (!r.ok) {
            error.textContent = mensajeError(r);
            error.classList.remove('d-none');
            return;
        }

        modal('modalUsuario').hide();
        mostrarAviso('aviso', usuarioEnEdicion ? 'Usuario actualizado.' : 'Usuario registrado.', 'success');
        recargar();
    });

    document.getElementById('tablaUsuarios').addEventListener('click', async ev => {
        const boton = ev.target.closest('button[data-accion]');
        if (!boton || boton.disabled) return;

        const u = usuarios[Number(boton.dataset.i)];

        if (boton.dataset.accion === 'editar') {
            abrirForm(u);
            return;
        }

        if (!confirm('¿Eliminar al usuario ' + u.correo + '?')) return;

        const r = await api('/api/usuarios/' + encodeURIComponent(u.correo), { method: 'DELETE' });

        if (r.ok) {
            mostrarAviso('aviso', 'Usuario eliminado.', 'success');
            recargar();
        } else {
            mostrarAviso('aviso', mensajeError(r), 'danger');
        }
    });

    recargar();
  </script>
</body>
</html>
