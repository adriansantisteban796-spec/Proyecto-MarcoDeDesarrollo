<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova School - Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/estilos.css">
    <script src="Js/app.js"></script>
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h2 class="fw-bold text-dark mb-1">Reservas de Laboratorio</h2>
        <p class="text-muted mb-0">Consulta las solicitudes de reserva. El Coordinador las aprueba; quien la pidió puede cancelarla mientras esté pendiente.</p>
      </div>
      <div class="mt-3 mt-md-0">
        <a href="inventario.html" class="btn btn-primary shadow-sm">
          <i class="bi bi-calendar-plus me-1"></i> Reservar un equipo
        </a>
      </div>
    </div>

    <div id="mensaje" class="alert d-none" role="alert"></div>

    <!-- Filtro -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-md-4">
            <select class="form-select" id="filtroEstado">
              <option value="">Todos los Estados</option>
              <option value="PENDIENTE">Pendiente</option>
              <option value="APROBADA">Aprobada</option>
              <option value="CANCELADA">Cancelada</option>
            </select>
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-dark" id="btnFiltrar"><i class="bi bi-funnel me-1"></i>Filtrar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th class="ps-3">N°</th>
                <th>Laboratorio</th>
                <th>Equipo</th>
                <th>Fecha</th>
                <th>Horario</th>
                <th>Solicitante</th>
                <th class="text-center">Estado</th>
                <th class="text-end pe-3">Acción</th>
              </tr>
            </thead>
            <tbody id="tablaReservas">
              <tr><td colspan="8" class="text-center text-muted py-4">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Editar reserva -->
  <div class="modal fade" id="modalEditarReserva" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold"><i class="bi bi-pencil me-2"></i>Editar Reserva</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formEditarReserva">
            <div class="mb-3">
              <label class="form-label fw-semibold">Reserva</label>
              <input type="text" id="edInfo" class="form-control bg-light" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Fecha de Uso</label>
              <input type="date" id="edFecha" class="form-control" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Hora de inicio</label>
                <input type="time" id="edInicio" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Hora de fin</label>
                <input type="time" id="edFin" class="form-control" required>
              </div>
            </div>
            <div id="errorEdicion" class="alert alert-danger py-2 small d-none mb-0"></div>
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary px-4" id="btnGuardarEdicion">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    montarLayout('reservas', 'Reserva de Laboratorios');

    const badges = {
        PENDIENTE: '<span class="badge rounded-pill bg-warning text-dark px-3 py-2"><i class="bi bi-hourglass-split me-1"></i>Pendiente</span>',
        APROBADA:  '<span class="badge rounded-pill bg-success px-3 py-2"><i class="bi bi-check-circle-fill me-1"></i>Aprobada</span>',
        CANCELADA: '<span class="badge rounded-pill bg-secondary px-3 py-2"><i class="bi bi-x-circle-fill me-1"></i>Cancelada</span>'
    };

    let catalogos = { laboratorios: [], categorias: [] };
    let equipos = [];
    let reservas = [];
    let reservaEnEdicion = null;

    function nombreEquipo(id) {
        if (id == null) return '<span class="text-muted">—</span>';
        const e = equipos.find(x => x.id_equipo === id);
        return e ? escapar(e.codigo_inventario) + '<br><small class="text-muted">' + escapar(e.nombre) + '</small>' : 'Equipo ' + id;
    }

    // Las reservas antiguas guardan el nombre del laboratorio; las nuevas, su id
    function laboratorio(valor) {
        const lab = catalogos.laboratorios.find(l => String(l.id) === String(valor));
        return lab ? lab.codigo : valor;
    }

    // Mismas reglas que el backend: aprobar solo el Coordinador;
    // cancelar solo reservas pendientes, el solicitante o el Coordinador
    function acciones(r) {
        let html = '';
        const puedeCancelar = Sesion.esCoordinador() || r.solicitante === Sesion.correo();

        if (r.estado === 'PENDIENTE' && Sesion.esCoordinador()) {
            html += `<button class="btn btn-sm btn-success me-1" data-accion="aprobar" data-id="${r.id_reserva}"><i class="bi bi-check-lg"></i> Aprobar</button>`;
        }
        if (r.estado === 'PENDIENTE' && puedeCancelar) {
            html += `<button class="btn btn-sm btn-outline-primary me-1" data-accion="editar" data-id="${r.id_reserva}" title="Editar"><i class="bi bi-pencil"></i></button>`;
            html += `<button class="btn btn-sm btn-outline-danger me-1" data-accion="cancelar" data-id="${r.id_reserva}"><i class="bi bi-x-lg"></i> Cancelar</button>`;
        }
        if (Sesion.esCoordinador()) {
            html += `<button class="btn btn-sm btn-outline-secondary" data-accion="eliminar" data-id="${r.id_reserva}" title="Eliminar"><i class="bi bi-trash"></i></button>`;
        }
        return html || '<span class="text-muted small">—</span>';
    }

    async function cargarReservas() {
        const estado = document.getElementById('filtroEstado').value;
        const tbody = document.getElementById('tablaReservas');

        const r = await api('/api/reservas' + (estado ? '?estado=' + encodeURIComponent(estado) : ''));

        if (!r.ok) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">No se pudieron cargar las reservas.</td></tr>';
            return;
        }

        reservas = r.datos;

        if (r.datos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No hay reservas registradas.</td></tr>';
            return;
        }

        tbody.innerHTML = r.datos.map(x => `
            <tr>
                <td class="ps-3 fw-bold text-secondary">R-${x.id_reserva}</td>
                <td class="fw-semibold">${escapar(laboratorio(x.laboratorio))}</td>
                <td>${nombreEquipo(x.id_equipo)}</td>
                <td>${escapar(x.fecha)}</td>
                <td>${escapar(x.horaInicio)} - ${escapar(x.horaFin)}</td>
                <td><small>${escapar(x.solicitante) || '<span class="text-muted">—</span>'}</small></td>
                <td class="text-center">${badges[x.estado] || escapar(x.estado)}</td>
                <td class="text-end pe-3 text-nowrap">${acciones(x)}</td>
            </tr>`).join('');
    }

    const mensajes = { aprobar: 'Reserva aprobada.', cancelar: 'Reserva cancelada.' };

    document.getElementById('tablaReservas').addEventListener('click', async ev => {
        const boton = ev.target.closest('button[data-accion]');
        if (!boton) return;

        const id = boton.dataset.id;
        const accion = boton.dataset.accion;

        if (accion === 'editar') {
            abrirEdicion(reservas.find(x => String(x.id_reserva) === id));
            return;
        }

        if (accion === 'eliminar' && !confirm('¿Eliminar la reserva R-' + id + '?')) return;

        const r = accion === 'eliminar'
            ? await api('/api/reservas/' + id, { method: 'DELETE' })
            : await api('/api/reservas/' + id + '/' + accion, { method: 'PUT' });

        if (r.ok) {
            mostrarAviso('mensaje', mensajes[accion] || 'Reserva eliminada.', 'success');
            cargarReservas();
        } else {
            mostrarAviso('mensaje', mensajeError(r), 'danger');
        }
    });

    // ---------- Editar una reserva pendiente ----------
    function abrirEdicion(r) {
        reservaEnEdicion = r;
        document.getElementById('errorEdicion').classList.add('d-none');
        document.getElementById('edInfo').value =
            'R-' + r.id_reserva + ' · ' + laboratorio(r.laboratorio)
            + (r.id_equipo != null ? ' · equipo ' + r.id_equipo : '');
        document.getElementById('edFecha').min = hoyISO();
        document.getElementById('edFecha').value = r.fecha;
        document.getElementById('edInicio').value = r.horaInicio;
        document.getElementById('edFin').value = r.horaFin;
        bootstrap.Modal.getOrCreateInstance(document.getElementById('modalEditarReserva')).show();
    }

    document.getElementById('btnGuardarEdicion').addEventListener('click', async () => {
        const form = document.getElementById('formEditarReserva');
        const error = document.getElementById('errorEdicion');
        error.classList.add('d-none');

        if (!form.reportValidity()) return;

        const r = await api('/api/reservas/' + reservaEnEdicion.id_reserva, {
            method: 'PUT',
            body: {
                laboratorio: reservaEnEdicion.laboratorio,
                id_equipo: reservaEnEdicion.id_equipo,
                fecha: document.getElementById('edFecha').value,
                horaInicio: document.getElementById('edInicio').value,
                horaFin: document.getElementById('edFin').value
            }
        });

        if (!r.ok) {
            error.textContent = mensajeError(r);
            error.classList.remove('d-none');
            return;
        }

        bootstrap.Modal.getInstance(document.getElementById('modalEditarReserva')).hide();
        mostrarAviso('mensaje', 'Reserva actualizada.', 'success');
        cargarReservas();
    });

    document.getElementById('btnFiltrar').addEventListener('click', cargarReservas);

    (async () => {
        catalogos = await cargarCatalogos();
        const e = await api('/api/equipos');
        equipos = e.ok ? e.datos : [];
        cargarReservas();
    })();
  </script>
</body>
</html>
