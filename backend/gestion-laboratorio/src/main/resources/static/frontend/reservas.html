<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova School - Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/estilos.css">

    <script>
    if (!localStorage.getItem('usuarioActivo')) {
      window.location.href = 'Login.html';
    }
  </script>
</head>
<body class="bg-light">
  <!-- Barra superior -->
  <nav class="bg-dark text-white py-2">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="small text-secondary">Reserva de Laboratorios</span>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-primary px-3 py-2" id="badgeRol">Rol: Docente</span>
        <span class="small text-light" id="txtUsuario">usuario</span>
        <button class="btn btn-outline-danger btn-sm" id="btnCerrarSesion">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <!-- Barra de Navegación -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="boostrap.html">
        <i class="bi bi-cpu me-1"></i>Innova Schools
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="boostrap.html">Inicio</a>
          <a class="nav-link" href="inventario.html">Inventario</a>
          <a class="nav-link active fw-bold" href="reservas.html">Reservas</a>
          <a class="nav-link" href="prestamos.html">Préstamos</a>
          <a class="nav-link" href="mantenimiento.html">Mantenimiento</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h2 class="fw-bold text-dark mb-1">Reservas de Laboratorio</h2>
        <p class="text-muted mb-0">Consulta, aprueba o cancela las solicitudes de reserva.</p>
      </div>
    </div>

    <div id="mensaje" class="alert d-none" role="alert"></div>

    <!-- Filtro -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-md-4">
            <select class="form-select" id="filtroEstado">
              <option value="">Todos los Estados</option>
              <option value="PENDIENTE">Pendiente</option>
              <option value="APROBADA">Aprobada</option>
              <option value="CANCELADA">Cancelada</option>
            </select>
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-dark" id="btnFiltrar"><i class="bi bi-funnel me-1"></i>Filtrar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th class="ps-3">N°</th>
                <th>Laboratorio</th>
                <th>Fecha</th>
                <th>Horario</th>
                <th class="text-center">Estado</th>
                <th class="text-end pe-3">Acción</th>
              </tr>
            </thead>
            <tbody id="tablaReservas">
              <tr><td colspan="6" class="text-center text-muted py-4">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const rol = localStorage.getItem('rolActivo') || '';
    const esCoordinador = rol === 'Coordinador';

    document.getElementById('txtUsuario').textContent = localStorage.getItem('usuarioActivo') || 'Docente';
    document.getElementById('badgeRol').textContent = 'Rol: ' + (rol || 'Docente');

    document.getElementById('btnCerrarSesion').addEventListener('click', function () {
        localStorage.removeItem('usuarioActivo');
        localStorage.removeItem('rolActivo');
        localStorage.removeItem('token');
        window.location.href = 'Login.html';
    });

    const badges = {
        PENDIENTE: '<span class="badge rounded-pill bg-warning text-dark px-3 py-2"><i class="bi bi-hourglass-split me-1"></i>Pendiente</span>',
        APROBADA:  '<span class="badge rounded-pill bg-success px-3 py-2"><i class="bi bi-check-circle-fill me-1"></i>Aprobada</span>',
        CANCELADA: '<span class="badge rounded-pill bg-secondary px-3 py-2"><i class="bi bi-x-circle-fill me-1"></i>Cancelada</span>'
    };

    function mostrarMensaje(texto, tipo) {
        const el = document.getElementById('mensaje');
        el.className = 'alert alert-' + tipo;
        el.textContent = texto;
    }

    function escapar(t) {
        const d = document.createElement('div');
        d.textContent = t == null ? '' : t;
        return d.innerHTML;
    }

    function acciones(r) {
        let html = '';
        if (r.estado === 'PENDIENTE' && esCoordinador) {
            html += `<button class="btn btn-sm btn-success me-1" onclick="cambiarEstado(${r.id_reserva}, 'aprobar')"><i class="bi bi-check-lg"></i> Aprobar</button>`;
        }
        if (r.estado !== 'CANCELADA') {
            html += `<button class="btn btn-sm btn-outline-danger" onclick="cambiarEstado(${r.id_reserva}, 'cancelar')"><i class="bi bi-x-lg"></i> Cancelar</button>`;
        }
        return html || '<span class="text-muted small">—</span>';
    }

    function cargarReservas() {
        const estado = document.getElementById('filtroEstado').value;
        const url = '/api/reservas' + (estado ? '?estado=' + encodeURIComponent(estado) : '');
        const tbody = document.getElementById('tablaReservas');

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(lista => {
                if (lista.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No hay reservas registradas.</td></tr>';
                    return;
                }
                tbody.innerHTML = lista.map(r => `
                    <tr>
                        <td class="ps-3 fw-bold text-secondary">R-${r.id_reserva}</td>
                        <td class="fw-semibold">${escapar(r.laboratorio)}</td>
                        <td>${escapar(r.fecha)}</td>
                        <td>${escapar(r.horaInicio)} - ${escapar(r.horaFin)}</td>
                        <td class="text-center">${badges[r.estado] || escapar(r.estado)}</td>
                        <td class="text-end pe-3">${acciones(r)}</td>
                    </tr>`).join('');
            })
            .catch(() => {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">No se pudieron cargar las reservas.</td></tr>';
            });
    }

    function cambiarEstado(id, accion) {
        fetch(`/api/reservas/${id}/${accion}`, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') }
        })
            .then(res => res.text().then(t => ({ ok: res.ok, texto: t })))
            .then(({ ok, texto }) => {
                if (ok) {
                    mostrarMensaje(accion === 'aprobar' ? 'Reserva aprobada.' : 'Reserva cancelada.', 'success');
                    cargarReservas();
                } else {
                    mostrarMensaje(texto || 'No se pudo completar la acción.', 'danger');
                }
            })
            .catch(() => mostrarMensaje('No se pudo conectar con el servidor.', 'danger'));
    }

    document.getElementById('btnFiltrar').addEventListener('click', cargarReservas);
    cargarReservas();
  </script>
</body>
</html>
