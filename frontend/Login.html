<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innova School - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/estilos.css">
    <link rel="stylesheet" href="Css/login.css">
</head>
<body class="login-page">
    <div class="card card-login p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="login-logo text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Innova Schools</h3>
            <p class="text-muted small mb-0">Gestion de Reservas de Laboratorio</p>
        </div>

        <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="correo" class="form-label fw-semibold text-secondary">Correo Institucional</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="correo" class="form-control" placeholder="usuario@innovaschools.edu.pe" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="btn toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 py-2 fw-semibold shadow-sm mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar al Sistema
            </button>
        </form>

        <p class="login-footer text-center mt-4 mb-0">&copy; Innova Schools · Laboratorio</p>
    </div>


<script>
    document.getElementById('togglePass').addEventListener('click', function () {
        const input = document.getElementById('password');
        const show = input.type === 'password';

        input.type = show ? 'text' : 'password';

        this.querySelector('i').className =
            show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    document.getElementById('formLogin').addEventListener('submit', async function (e) {
        e.preventDefault();

        const correo = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;
        const error = document.getElementById('loginError');

        error.classList.add('d-none');

        try {
            const respuesta = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    correo: correo,
                    password: password
                })
            });

            const texto = await respuesta.text();

            if (!respuesta.ok) {
                error.textContent = texto || 'Correo o contraseña incorrectos';
                error.classList.remove('d-none');
                return;
            }

            const token = texto.trim();

            // Guardar el token JWT
            localStorage.setItem('token', token);
            localStorage.setItem('usuarioActivo', correo);

            // Obtener el rol real desde el token
            let rolReal;

            try {
                const payload = token.split('.')[1];
                const payloadBase64 = payload
                    .replace(/-/g, '+')
                    .replace(/_/g, '/');

                rolReal = JSON.parse(atob(payloadBase64)).rol;
            } catch (e) {
                localStorage.removeItem('token');
                localStorage.removeItem('usuarioActivo');

                error.textContent = 'No se pudo interpretar el token recibido';
                error.classList.remove('d-none');
                return;
            }

            if (!rolReal) {
                localStorage.removeItem('token');
                localStorage.removeItem('usuarioActivo');

                error.textContent = 'El token no contiene el rol del usuario';
                error.classList.remove('d-none');
                return;
            }

            localStorage.setItem('rolActivo', rolReal);

            // Redirigir al menú principal
            window.location.href = 'boostrap.html';

        } catch (e) {
            error.textContent = 'No se pudo conectar con el servidor';
            error.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
